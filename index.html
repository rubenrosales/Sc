<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SC26 Planner</title>
  <meta name="description" content="Fast, offline-friendly personal schedule planner for the SC26 supercomputing conference.">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SC26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/parsers.js">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/my"><img src="icons/icon.svg" alt="" width="28" height="28"><span>SC26 <em>Planner</em></span></a>
    <a class="searchbtn" href="#/all" aria-label="Search full schedule" onclick="setTimeout(()=>document.getElementById('q')?.focus(),50)">🔍</a>
  </header>
  <nav class="days" id="days" aria-label="Conference days"></nav>
  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#/my" data-tab="my"><span>★</span>My Schedule</a>
    <a href="#/all" data-tab="all"><span>☰</span>Full Schedule</a>
    <a href="#/add" data-tab="add"><span>＋</span>Add</a>
    <a href="#/more" data-tab="more"><span>⋯</span>More</a>
  </nav>

  <dialog id="sheet"></dialog>
  <div id="toast" role="status"></div>

  <noscript><p style="padding:2rem">This planner needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
